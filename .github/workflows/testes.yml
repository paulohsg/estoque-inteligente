name: Testes automáticos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-24.04  # Playwright 1.56 ainda não instala dependências no Ubuntu 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci
      - name: Instalar o navegador Chromium
        run: npx playwright install --with-deps chromium
      - name: Rodar os testes
        run: npx playwright test
      - name: Guardar o relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dos-testes
          path: playwright-report/
          retention-days: 14
